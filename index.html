<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karbantartás alatt | Tégláról-téglára</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background: linear-gradient(135deg, #1A1B26 0%, #252B3B 50%, #1A1F30 100%);
      color: #C0CAF5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    .logo {
      font-size: 80px;
      margin-bottom: 30px;
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 18px;
      color: #9AA5CE;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .status {
      background: rgba(192, 202, 245, 0.08);
      border: 1px solid rgba(192, 202, 245, 0.15);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      font-size: 15px;
      color: #C0CAF5;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid rgba(192, 202, 245, 0.2);
      border-top-color: #CE2939;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .footer {
      margin-top: 50px;
      font-size: 13px;
      color: #9AA5CE;
      border-top: 1px solid rgba(192, 202, 245, 0.08);
      padding-top: 20px;
    }

    .version {
      display: inline-block;
      background: rgba(206, 41, 57, 0.15);
      color: #e8405a;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🧱</div>

    <h1>Karbantartás alatt</h1>

    <p class="subtitle">
      Az oldal jelenleg frissítés alatt áll.<br>
      Hamarosan visszatérünk!
    </p>

    <div class="spinner"></div>

    <div class="status">
      <strong>Mit csinálunk?</strong><br>
      Fejlesztünk, javítunk, optimalizálunk az Ígérethálóban.<br>
      <br>
      <strong>Mikor lesz kész?</strong><br>
      Hamarosan. Köszönjük a türelmet! 🙏
    </div>

    <div class="footer">
      <p>Tégláról-téglára | TISZA ígéretkövető</p>
      <div class="version">Ver. 4.73</div>
    </div>
  </div>
</body>
</html>
