name: Napi automatikus frissítés

on:
  schedule:
    # Minden nap reggel 7:00 UTC (9:00 Magyarország)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Repo letöltése
        uses: actions/checkout@v4

      - name: 🐍 Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Függőségek
        run: pip install anthropic

      - name: 🤖 Claude frissítő
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py

      - name: 📊 Változás ellenőrzés
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: 💾 Commit & push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "Tégláról-téglára Bot"
          git config user.email "bot@teglarol-teglara.hu"
          git add data.json index.html index.template.html
          git commit -m "🤖 Automatikus frissítés $(date '+%Y-%m-%d %H:%M')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
